version: '3.8'

services:
  # 사용자 API 서버
  user-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./performance_logs:/app/performance_logs
      - ./datasets:/app/datasets
    depends_on:
      - redis
    command: uvicorn user_api:user_app --host 0.0.0.0 --port 8000

  # 관리자 API 서버
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8001:8001"
    environment:
      - MOCK_MODE=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./performance_logs:/app/performance_logs
      - ./datasets:/app/datasets
    depends_on:
      - redis
    command: uvicorn admin_api:admin_app --host 0.0.0.0 --port 8001

  # 크롬 확장 API
  chrome-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - "8002:8002"
    environment:
      - MOCK_MODE=true
    command: uvicorn chrome_extension_api:chrome_app --host 0.0.0.0 --port 8002

  # Streamlit 대시보드
  streamlit-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - MOCK_MODE=true
    volumes:
      - ./performance_logs:/app/performance_logs
    depends_on:
      - user-api
    command: streamlit run streamlit_dashboard.py --server.port=8501 --server.address=0.0.0.0

  # Redis (캐싱용)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data: